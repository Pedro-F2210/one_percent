<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/auth.css">
    <link rel="shortcut icon" href="images/logo_onepercent_icon.ico" type="image/x-icon">
</head>
<body>
    <main>
        <img src="images/logo_onepercent.png" alt="logo one percent">
        <section>
            <h1>Bem-vindo de volta</h1>
            <h2>Entra para aceder ao teu espaço.</h2>
            <form action="" method="post" autocomplete="on">
                <div class="grupo-input">
                    <label for="iemail">Email</label>
                    <input type="email" name="email" id="iemail" required autocomplete="email" placeholder="O teu email">
                </div>
                <div class="grupo-input">
                    <label for="isenha">Senha</label>
                    <input type="password" name="senha" id="isenha" required minlength="5" maxlength="20" autocomplete="current-password" placeholder="A tua senha">
                </div>
                <button type="submit">Entrar</button>
            </form>
            <p>Não tem conta? <a href="registo.html" id="registe-se">Registe-se aqui</a></p>
        </section>
    </main>
</body>
</html>
